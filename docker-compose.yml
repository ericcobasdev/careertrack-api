services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: careertrack-api-app
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: careertrack
      DB_USERNAME: careertrack
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - careertrack

  nginx:
    image: nginx:1.27-alpine
    container_name: careertrack-api-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - careertrack

  mysql:
    image: mysql:8.0
    container_name: careertrack-api-mysql
    environment:
      MYSQL_DATABASE: careertrack
      MYSQL_USER: careertrack
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33066:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careertrack

networks:
  careertrack:
    driver: bridge

volumes:
  mysql-data:
    driver: local
