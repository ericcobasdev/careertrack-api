apiVersion: v1
kind: ConfigMap

metadata:
  name: careertrack-php-config
  namespace: careertrack

data:
  APP_NAME: "CareerTrack"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://careertrack.local"

  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"

  DB_CONNECTION: "mysql"
  DB_HOST: "careertrack-mysql"
  DB_PORT: "3306"
  DB_DATABASE: "careertrack"

  CACHE_STORE: "file"
  SESSION_DRIVER: "file"
  QUEUE_CONNECTION: "sync"